[workspace]
resolver = "3"
members = [
  "crates/kahea-core",
  "crates/kahea-conformance",
  "crates/kahea-ingest",
  "crates/kahea-test-server",
  "crates/kahea-plan",
  "crates/kahea-evidence",
  "crates/kahea-exec",
  "crates/kahea-mcp",
  "crates/kahea-workflow",
  "crates/kahea",
]

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/copyleftdev/kahea"
homepage = "https://github.com/copyleftdev/kahea"
description = "Local-first deterministic API invocation kernel for coding agents"
publish = false

[workspace.dependencies]
blake3 = "1.8.2"
base64 = "0.23.0"
clap = { version = "4.5.45", features = ["derive"] }
schemars = { version = "1.0.4", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
thiserror = "2.0.15"
toml = "1.1.4"
percent-encoding = "2.3.2"
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls", "http2", "gzip", "brotli", "deflate"] }
httparse = "1.10.1"
rustls = { version = "0.23.43", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-native-certs = "0.8.4"
rustls-pki-types = { version = "1.15.1", features = ["std"] }
serde_json_path = { version = "0.7.2", default-features = false }
sha1 = "0.11.0"
shell-words = "1.1.1"
sxd-document = "0.3.2"
sxd-xpath = "0.4.2"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }
url = "2.5.7"
yaml-rust2 = { version = "0.12.0", default-features = false }
zstd = "0.13.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
