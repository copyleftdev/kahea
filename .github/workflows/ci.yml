name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y jq
      - run: scripts/gates.sh

  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Without --no-fail-fast the first failing binary hides every later one,
      # which turns a platform difference into several sequential CI rounds.
      - run: cargo test --workspace --no-fail-fast

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

# Mutation testing is deliberately not a CI job. Every mutant rebuilds the
# workspace and reruns its whole suite, so a full sweep runs for hours of
# billable runner time to re-derive a result that does not change between
# commits. `scripts/mutation-gate.sh` is a local tool; run it before releasing
# or after touching a kernel crate.
