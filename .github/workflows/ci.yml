name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    runs-on: ubuntu-latest
    # A step that hangs rather than fails gets the six-hour default, and the job
    # is killed without uploading a log, so it reports nothing about what stalled.
    # One apt-get did exactly that for 80 minutes. Every job below is bounded at
    # roughly ten times its observed runtime: slow enough never to cut off real
    # work, fast enough that a stall costs a re-run instead of an afternoon.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # gates.sh needs jq, which ubuntu-latest ships preinstalled. The apt-get
      # that used to stand here only ever reported "already the newest version",
      # so it bought a network dependency and a hang for nothing. If a future
      # image drops jq, gates.sh says so outright instead of stalling.
      - run: scripts/gates.sh

  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      # Without --no-fail-fast the first failing binary hides every later one,
      # which turns a platform difference into several sequential CI rounds.
      #
      # RUST_TEST_THREADS caps intra-binary parallelism. Several tests bind loopback
      # servers and assert that a deadline expires; on a two-core shared runner the
      # default thread count lets those tests compete for CPU with each other and
      # expire the wrong deadline. Their budgets are generous now, but the load is
      # what made a passing suite intermittent, and it costs a re-run every time.
      - run: cargo test --workspace --no-fail-fast
        env:
          RUST_TEST_THREADS: 4

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.95.0"
          command: check advisories

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.95.0"
          command: check bans licenses sources
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Mutation testing is deliberately not a CI job. Every mutant rebuilds the
# workspace and reruns its whole suite, so a full sweep runs for hours of
# billable runner time to re-derive a result that does not change between
# commits. `scripts/mutation-gate.sh` is a local tool; run it before releasing
# or after touching a kernel crate.
