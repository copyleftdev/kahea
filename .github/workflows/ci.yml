name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y jq
      - run: scripts/gates.sh

  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Every mutant now carries the whole workspace suite behind it, so the gating
  # run is scoped to the two kernel packages to stay inside a runner's time and
  # disk budget. The full four-package sweep runs weekly and on demand.
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-mutants --locked
      - run: scripts/mutation-gate.sh
        env:
          KAHEA_MUTANT_PACKAGES: kahea-core kahea-plan
          KAHEA_MUTANT_JOBS: "2"
          KAHEA_MUTANT_COPY_TARGET: "false"

  # Reports rather than gates: kahea-conformance still has known survivors in
  # the negative-mutation and execution paths, and blocking every push on them
  # would only teach people to ignore a red check.
  mutation-full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-mutants --locked
      - run: scripts/mutation-gate.sh
        env:
          KAHEA_MUTANT_JOBS: "2"
          KAHEA_MUTANT_COPY_TARGET: "false"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-full
          path: mutants.out/
